{% if messages %}
  <div class="mb-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible" role="alert">
        <div class="text-muted">{{ message }}</div>
        <a class="btn-close" data-bs-dismiss="alert" aria-label="Close"></a>
      </div>
    {% endfor %}
  </div>
{% endif %}
