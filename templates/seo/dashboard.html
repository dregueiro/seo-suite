{% extends "layouts/base.html" %}
{% block content %}
<div class="container-fluid">
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <div class="text-muted">Projects</div>
          <div class="h2 mb-0">{{ projects_count }}</div>
          <a class="btn btn-sm btn-outline-primary mt-3" href="{% url 'seo:projects_list' %}">Ver Projects</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <div class="text-muted">Runs</div>
          <div class="h2 mb-0">{{ runs_count }}</div>
          <a class="btn btn-sm btn-outline-primary mt-3" href="{% url 'seo:runs_list' %}">Ver Runs</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
