{% extends 'layouts/base.html' %}

{% load static %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title mb-3">Project Setup</h5>

    <form method="post" class="row g-3">
      {% csrf_token %}

      <div class="col-md-6">
        <label class="form-label">Dominio</label>
        <input type="text" name="domain" class="form-control" value="{{ form.domain.value|default_if_none:'' }}">
      </div>

      <div class="col-md-6">
        <label class="form-label">País</label>
        <input type="text" name="country" class="form-control" value="{{ form.country.value|default_if_none:'' }}">
      </div>

      <div class="col-12">
        <button class="btn btn-primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
