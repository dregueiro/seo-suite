{% load static %}
<header id="page-topbar">
  <div class="layout-width">
    <div class="navbar-header d-flex align-items-center justify-content-between">

      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-sm px-2 fs-16 header-item" id="vertical-menu-btn">
          <i class="ri-menu-2-line"></i>
        </button>

        <a href="{% url 'seo_dashboard' %}" class="text-decoration-none">
          <span class="fw-semibold text-dark">SEOSuite</span>
        </a>

        {% if project %}
          <span class="text-muted ms-2 d-none d-md-inline">
            {{ project.client.name }} / {{ project.name }}
          </span>
        {% endif %}
      </div>

      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-secondary" href="/admin/" title="Admin">
          <i class="ri-settings-3-line"></i>
        </a>

        {% if request.user.is_authenticated %}
          <span class="text-muted d-none d-md-inline">{{ request.user.username }}</span>
        {% endif %}
      </div>

    </div>
  </div>
</header>
