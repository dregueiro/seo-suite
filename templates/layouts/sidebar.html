{% load static %}
<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

  <!-- Brand -->
  <div class="sidebar-brand">
    <a href="/" class="brand-link">
      <span class="brand-text fw-light">SEOSuite</span>
    </a>
  </div>

  <!-- Sidebar -->
  <div class="sidebar-wrapper">
    <nav class="mt-2">
      <ul
        class="nav sidebar-menu flex-column"
        data-lte-toggle="treeview"
        role="navigation"
        aria-label="Main navigation"
        data-accordion="false"
      >
        <!-- Dashboard / Home -->
        <li class="nav-item">
          <a href="/" class="nav-link">
            <i class="nav-icon bi bi-speedometer"></i>
            <p>Dashboard</p>
          </a>
        </li>

        <!-- Proyecto (si hay project en contexto) -->
        {% if project %}
          <li class="nav-header">PROYECTO</li>

          <li class="nav-item">
            <a href="/seo/projects/{{ project.id }}/setup/" class="nav-link">
              <i class="nav-icon bi bi-wrench-adjustable"></i>
              <p>Setup</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="/seo/projects/{{ project.id }}/keywords/overview/" class="nav-link">
              <i class="nav-icon bi bi-search"></i>
              <p>Keyword Overview</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="/seo/projects/{{ project.id }}/keywords/magic/" class="nav-link">
              <i class="nav-icon bi bi-stars"></i>
              <p>Keyword Magic</p>
            </a>
          </li>
        {% endif %}

        <li class="nav-header">ADMIN</li>

        <li class="nav-item">
          <a href="/admin/core/run/" class="nav-link">
            <i class="nav-icon bi bi-clock-history"></i>
            <p>Runs</p>
          </a>
        </li>

        <li class="nav-item">
          <a href="/admin/core/runartifact/" class="nav-link">
            <i class="nav-icon bi bi-file-earmark-arrow-down"></i>
            <p>Artifacts</p>
          </a>
        </li>

        <li class="nav-item">
          <a href="/admin/" class="nav-link">
            <i class="nav-icon bi bi-shield-lock"></i>
            <p>Django Admin</p>
          </a>
        </li>

      </ul>
    </nav>
  </div>
</aside>
