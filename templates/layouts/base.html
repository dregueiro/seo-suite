{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    {% include "layouts/partials/head.html" %}
  </head>

  <body data-menu-color="light" data-sidebar="default">
    <!-- Begin page -->
    <div id="app-layout">
      {% include "layouts/partials/topbar.html" %}
      <div class="app-sidebar-menu">
        <div class="h-100" data-simplebar>
          {% include "layouts/partials/sidebar.html" %}
          <div class="clearfix"></div>
        </div>
      </div>

  <!-- ============================================================== -->
      <!-- Start Page Content here -->
      <!-- ============================================================== -->

      <div class="content-page">
        <div class="content">
          <div class="container-fluid">
            {% block content %} {% endblock %}
          </div>
        </div>
      </div>

      <!-- Footer Start -->
      {% include "layouts/partials/footer.html" %}
      <!-- end Footer -->

    </div>

    <!-- Vendor -->

    <script src="{% static 'vendor/hando/dist/assets/libs/jquery/jquery.min.js' %} "></script>
    <script src="{% static 'vendor/hando/dist/assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/hando/dist/assets/libs/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'vendor/hando/dist/assets/libs/node-waves/waves.min.js' %}"></script>
    <script src="{% static 'vendor/hando/dist/assets/libs/waypoints/lib/jquery.waypoints.min.js' %}"></script>
    <script src="{% static 'vendor/hando/dist/assets/libs/jquery.counterup/jquery.counterup.min.js' %}"></script>
    <script src="{% static 'vendor/hando/dist/assets/libs/feather-icons/feather.min.js' %}"></script>

    <!-- App js-->
    <script src="{% static 'vendor/hando/dist/assets/js/app.js' %}"></script>
    {% block vendor %} {%endblock %}

  </body>


</html>
