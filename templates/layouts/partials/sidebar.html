{% load static %}

<div class="app-menu navbar-menu">
  <div class="navbar-brand-box">
    <a href="{% url 'seo:dashboard' %}" class="logo logo-dark">
      <span class="logo-sm">
        <img src="{% static 'vendor/hando/dist/assets/images/logo-sm.png' %}" alt="" height="22">
      </span>
      <span class="logo-lg">
        <img src="{% static 'vendor/hando/dist/assets/images/logo-dark.png' %}" alt="" height="22">
      </span>
    </a>

    <a href="{% url 'seo:dashboard' %}" class="logo logo-light">
      <span class="logo-sm">
        <img src="{% static 'vendor/hando/dist/assets/images/logo-sm.png' %}" alt="" height="22">
      </span>
      <span class="logo-lg">
        <img src="{% static 'vendor/hando/dist/assets/images/logo-light.png' %}" alt="" height="22">
      </span>
    </a>

  </div>

  <div id="scrollbar">
    <div class="container-fluid">

      {% with pid=request.resolver_match.kwargs.project_id %}

      <ul class="navbar-nav" id="navbar-nav">

        <li class="menu-title"><span>General</span></li>

        <li class="nav-item">
          <a class="tp-link nav-link" href="{% url 'seo:dashboard' %}">
            <i data-feather="home"></i>
            <span> Dashboard </span>
          </a>
        </li>

        <li class="nav-item">
          <a class="tp-link nav-link" href="{% url 'seo:projects_list' %}">
            <i data-feather="folder"></i>
            <span> Proyectos </span>
          </a>
        </li>

        <li class="menu-title"><span>Keyword Research</span></li>

        <li class="nav-item">
          <a class="tp-link nav-link"
             href="{% if pid %}{% url 'seo:keyword_overview' pid %}{% else %}{% url 'seo:projects_list' %}{% endif %}">
            <i data-feather="search"></i>
            <span> Keyword Overview </span>
          </a>
        </li>

        <li class="nav-item">
          <a class="tp-link nav-link"
             href="{% if pid %}{% url 'seo:keyword_magic' pid %}{% else %}{% url 'seo:projects_list' %}{% endif %}">
            <i data-feather="grid"></i>
            <span> Keyword Magic Tool </span>
          </a>
        </li>

        <li class="nav-item">
          <a class="tp-link nav-link"
             href="{% if pid %}{% url 'seo:keyword_metrics' pid %}{% else %}{% url 'seo:projects_list' %}{% endif %}">
            <i data-feather="bar-chart-2"></i>
            <span> Keyword Metrics </span>
          </a>
        </li>

        <li class="menu-title"><span>Integrations</span></li>

        <li class="nav-item">
          <a class="tp-link nav-link"
             href="{% if pid %}{% url 'seo:project_setup' pid %}{% else %}{% url 'seo:projects_list' %}{% endif %}">
            <i data-feather="link"></i>
            <span> Setup / Test access </span>
          </a>
        </li>

        <li class="menu-title"><span>Trazabilidad</span></li>

        <li class="nav-item">
          <a class="tp-link nav-link" href="{% url 'seo:runs_list' %}">
            <i data-feather="activity"></i>
            <span> Runs </span>
          </a>
        </li>

      </ul>

      {% endwith %}
    </div>
  </div>

  <div class="sidebar-background"></div>
</div>
<div class="vertical-overlay"></div>
