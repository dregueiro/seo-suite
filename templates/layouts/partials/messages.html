{% if messages %}
  <div id="flash-messages" class="mb-2">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-2"
           role="alert"
           data-autodismiss="true"
           data-autodismiss-ms="5000">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
