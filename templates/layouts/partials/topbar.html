{% load static %}
<div class="topbar-custom">
  <div class="container-fluid">
    <div class="d-flex justify-content-between">

      <!-- LEFT: Brand + toggle -->
      <ul class="list-unstyled topnav-menu mb-0 d-flex align-items-center">
        <li>
          <button class="button-toggle-menu nav-link" type="button">
            <i data-feather="menu" class="noti-icon"></i>
          </button>
        </li>

        <li class="d-none d-lg-block">
          <a href="{% url 'seo:dashboard' %}" class="navbar-brand m-0 p-0">
            <span class="fw-bold fs-18">SEOSuite</span>
          </a>
        </li>
      </ul>

      <!-- RIGHT: minimal actions + user -->
      <ul class="list-unstyled topnav-menu mb-0 d-flex align-items-center">

        <!-- Fullscreen -->
        <li class="d-none d-sm-flex">
          <button type="button" class="btn nav-link" data-toggle="fullscreen">
            <i data-feather="maximize" class="align-middle fullscreen noti-icon"></i>
          </button>
        </li>

        <!-- Light/Dark -->
        <li class="d-none d-sm-flex">
          <button type="button" class="btn nav-link" id="light-dark-mode">
            <i data-feather="moon" class="align-middle dark-mode"></i>
            <i data-feather="sun" class="align-middle light-mode"></i>
          </button>
        </li>

        <!-- User Dropdown -->
        <li class="dropdown notification-list topbar-dropdown">
          <a class="nav-link dropdown-toggle nav-user me-0"
             data-bs-toggle="dropdown" href="#" role="button"
             aria-haspopup="false" aria-expanded="false">
            <img src="{% static 'vendor/hando/dist/assets/images/users/user-13.jpg' %}"
                 alt="user-image" class="rounded-circle" />
            <span class="pro-user-name ms-1">
              {{ request.user.get_short_name|default:request.user.username }}
              <i class="mdi mdi-chevron-down"></i>
            </span>
          </a>

          <div class="dropdown-menu dropdown-menu-end profile-dropdown">
            <div class="dropdown-header noti-title">
              <h6 class="text-overflow m-0">Cuenta</h6>
            </div>

            <a class="dropdown-item notify-item" href="/admin/">
              <i class="mdi mdi-view-dashboard-outline fs-16 align-middle"></i>
              <span>Admin</span>
            </a>

            <div class="dropdown-divider"></div>

            <!-- Si todavía no tenés logout en frontend, dejalo así: -->
            <a class="dropdown-item notify-item" href="/admin/logout/">
              <i class="mdi mdi-location-exit fs-16 align-middle"></i>
              <span>Logout</span>
            </a>
          </div>
        </li>
      </ul>

    </div>
  </div>
</div>
<!-- end Topbar -->
